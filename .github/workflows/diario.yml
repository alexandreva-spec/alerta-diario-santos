name: Alerta Diário Oficial de Santos

on:
  schedule:
    # A cada 30 min, das 00h00 às 10h30 em Santos (UTC-3 = 03h-13h30 UTC).
    # O robô mesmo evita reprocessar: assim que acha a edição do dia, as
    # checagens seguintes encerram na hora sem bater no site de novo.
    - cron: "*/30 3-13 * * 1-5"
  workflow_dispatch:
    inputs:
      data:
        description: "Data da edição a checar (AAAA-MM-DD). Vazio = hoje."
        required: false

jobs:
  checar-diario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: pip install -r scraper/requirements.txt

      - name: Roda o robô
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
        run: |
          python scraper/robo_diario.py --data "${{ github.event.inputs.data }}"
